# =============================================================================
# hotspot3d — FROZEN PIPELINE CONFIGURATION
# =============================================================================
# Every scientific constant in the approved Plan lives here, gene-independent
# and pre-registered. Agents READ this file; no agent may write it.
#
# Provenance of each value is given as the Plan reference (F* fixed decision or
# METHOD_SPEC II.* section). Changing any value marked FROZEN is a
# methodological revision requiring a new pre-registration and a new RUN_ID.
# =============================================================================
schema_version: "1.0.0"
config_version: "1.0.0"

# --- II.0 / F1 — residue representation and distance --------------------------
representation:
  coordinate_atom: CA                 # FROZEN (F1) — Calpha only
  distance_metric: euclidean          # FROZEN (F1) — Ca-Ca Euclidean
  emit_unused_atoms: [CB, SC_CENTROID] # emitted for future flexibility, unused under F1

# --- II.13 / F12 — ClinVar inclusion policy -----------------------------------
clinvar:
  source: variant_summary             # weekly release; date + sha256 recorded
  variant_type: missense
  review_star_filter: null            # FROZEN (F12) — NO star filter, ever
  use_review_stars_for_inclusion: false # FROZEN (F12) — assertion target
  pathogenic_labels: [Pathogenic, "Likely pathogenic", "Pathogenic/Likely pathogenic"]
  benign_labels: [Benign, "Likely benign", "Benign/Likely benign"]
  # every other significance category stays in strata 1+3, never in the primary comparison
  non_binary_disposition: preserve_outside_primary   # FROZEN (F12)
  # --- FROZEN by explicit ruling before the first real gene ------------------
  # Real ClinVar aggregate labels carry orthogonal modifiers, e.g.
  # "Pathogenic, risk factor" or "Likely benign; other". The frozen rubric lists
  # only the bare labels, so the compound case had to be ruled on explicitly.
  #   component_wise : split on ',' and ';' (never on '/', which is part of the
  #                    aggregate label) and classify on the significance component,
  #                    so "Pathogenic, risk factor" enters P/LP.
  #   whole_field    : only an exact bare-label match enters the binary classes;
  #                    every compound label becomes non_binary_significance.
  # RULING: whole_field — the CONSERVATIVE reading. The primary P/LP-vs-B/LB
  # comparison admits only records classifiable unambiguously, so a label carrying
  # non-pathogenicity semantics ("risk factor", "association", "drug response",
  # "affects", "other") never enters the binary cohort on the strength of one
  # component. Aggregate labels are unaffected: '/' is not a separator, so
  # "Pathogenic/Likely pathogenic" remains P/LP.
  # Nothing is discarded. Excluded records stay in the raw and residue-level
  # outputs under non_binary_disposition: preserve_outside_primary (strata 1+3),
  # with significance_exact_match and significance_modifiers recorded per record,
  # so the component_wise reading remains fully recoverable without re-running.
  # Consequence to read deliberately: a record asserting both directions
  # ("Pathogenic; Benign") is excluded as non_binary_significance rather than as
  # residue_class_conflict. It is excluded from the primary cohort either way; only
  # the recorded reason differs. The F3 RESIDUE-level conflict policy below is a
  # separate rule and is unchanged.
  compound_significance_policy: whole_field
  # Minimum classified residues before the UNDERPOWERED condition is escalated.
  # null = no configured minimum, so only the hard gates apply (both classes
  # non-empty, |L| >= 2). Explicitly null rather than absent, so the dormant branch
  # is a recorded choice and not an accidental omission.
  min_classified_residues: null
  residue_class_conflict:
    policy: exclude_from_primary      # FROZEN (F3)
    preserve_all_source_records: true
  # --- [REVISED — Workflow v2 §1] faithful exclusion accounting --------------
  # v2: "Records excluded because they are synonymous, nonsense, frameshift, or
  # indel are NOT parse failures and must not be aggregated under a parse-
  # failure category." Before this ruling every non-missense protein consequence
  # (synonymous, nonsense, frameshift, in-frame indel) shared exclusion_reason=
  # unparseable_hgvs with genuine HGVS parse garbage, which is exactly the
  # conflation v2 prohibits. unparseable_hgvs is now reserved for records whose
  # HGVS notation could not be interpreted at all; a record that parsed cleanly
  # into a NON-missense protein consequence gets the new reason below. This adds
  # one enum value; it changes no cohort membership — a record excluded here was
  # excluded before too, only the recorded REASON changes. Not FROZEN: this is a
  # reporting vocabulary, not a scientific constant.
  exclusion_reason_enum:
    - vus
    - conflicting
    - non_binary_significance
    - ref_aa_mismatch
    - non_canonical_transcript
    - unparseable_hgvs
    - non_missense_variant_type
    - no_ca_coordinate
    - residue_class_conflict

# --- II.13 — transcript and structure sources --------------------------------
transcript:
  reference: MANE_SELECT              # FROZEN (II.13)
  fallback: longest_cds_matching_uniprot_canonical
  require_ref_aa_match: true
structure:
  source: alphafold
  # PRE-REGISTERED REVISION 2026-08-17 (Lead ruling, new RUN_ID).
  # Was "AF-{acc}-F1-model_v4". AlphaFold DB has WITHDRAWN v4 and v5: for
  # P16389 both .../files/AF-P16389-F1-model_v4.cif and ..._v5.cif return HTTP
  # 404, while the prediction API reports latestVersion 6 and serves
  # AF-P16389-F1-model_v6.cif (HTTP 200, 467738 bytes). The frozen pin was
  # therefore unsatisfiable against the live database and no structure could be
  # retrieved for any gene.
  # The DESIGN is unchanged: one explicitly named model version, auditable, and
  # moved only by an explicit decision. This is deliberately NOT "resolve the
  # latest at run time" — that would let the structural input change between
  # runs without anyone deciding, which is the property this pin exists to
  # protect. A future v7 requires another explicit revision, exactly like this
  # one.
  model_template: "AF-{acc}-F1-model_v6"
  multi_fragment_policy: block_and_escalate     # FROZEN (II.13)
  missing_entry_policy: escalate                # FROZEN (II.13)
  allow_homology_models: false                  # FROZEN (II.13)
  allow_ortholog_structures: false              # FROZEN (II.13)
  allow_experimental_substitute: false          # Lead may authorize only with reconciliation
  # --- [NEW — Workflow v2 §2] oligomeric assembly policy ----------------------
  # v2: the biological assembly must be determined (from UniProt/ComplexPortal
  # annotation) before a structural model is selected. An obligate homo/hetero-
  # oligomer analysed on a monomer is missing every inter-subunit neighbourhood a
  # real variant sits in. v2 gives two paths: use a multimer model of the
  # assembly, or BLOCKED: OLIGOMERIC_ASSEMBLY_UNAVAILABLE — with monomer-plus-
  # declared-limitation permitted ONLY as an explicit exception.
  #
  # RULING: this pipeline has no multimer-fetching capability (AlphaFold DB
  # serves monomer predictions for the overwhelming majority of entries, and no
  # multimer client exists here or is in Step-1-adjacent scope). Requiring
  # BLOCKED for every oligomeric human gene would make the pipeline unusable for
  # most real targets over a capability gap, not a data gap. The exception path
  # v2 names is therefore the DEFAULT, exactly as permitted: proceed on the
  # monomer, with the limitation recorded explicitly and every resulting
  # hotspot/footprint labelled intra-subunit-only in the output. Determination is
  # from UniProt's own subunit-structure annotation (the "UniProt" half of "
  # UniProt/ComplexPortal annotation" — ComplexPortal integration is deferred,
  # not because it is unneeded, but because it is new network-client scope
  # unrelated to this defect). Flip this to false to require BLOCKED instead.
  allow_monomer_for_obligate_oligomer: true
  oligomeric_state_source: uniprot_subunit_annotation

# --- F2 — pLDDT is recorded, never a primary filter --------------------------
plddt:
  primary_filtering_enabled: false    # FROZEN (F2)
  sensitivity_threshold: 70.0         # FROZEN (F2) — post-primary sensitivity only
  bands: [50.0, 70.0, 90.0]
  pae_threshold: null                 # FROZEN (F2) — none
  # --- [REVISED — Workflow v2 §2] the candidate-CENTER universe, not the cohort
  # F2 above governs the CLASSIFIED COHORT L: pLDDT is recorded and never filters
  # it. v2 §2 is a DIFFERENT, narrower rule about the CANDIDATE-CENTER universe
  # U_center: a residue with pLDDT < 50 is coordinate noise as a sphere center,
  # even though it is retained in L and in U_struct if it carries a variant. The
  # two universes are therefore DISTINCT and both are reported: |U_struct| (the
  # positional reference, F9, unchanged) and |U_center| (the tested-center
  # family before the "has a classified residue in sphere" restriction of §5.1).
  # This does not reopen F2: no cohort residue and no positional-null placement
  # is filtered by pLDDT anywhere.
  center_universe_min_plddt: 50.0     # FROZEN (v2 §2) — U_center exclusion only
  center_universe_excludes_low_confidence: true   # FROZEN (v2 §2)

# --- II.1 — global spatial statistics ----------------------------------------
global_clustering:
  grid_step_A: 1.0                    # FROZEN (II.1)
  pcf_shell_width_A: 1.0              # FROZEN (II.1)
  r_max_rule: half_dmax               # floor(D_max/2)
  null_model: structure_aware_positional   # FROZEN (F4)
  envelope_percentiles: [2.5, 97.5]
  # Significance level of the global max|Z| test. Derived from the frozen envelope
  # percentiles (2.5/97.5 -> two-sided 0.05) rather than invented, and stated here so
  # it is auditable instead of implicit. This governs ONLY the global-clustering
  # caveat flag; F5 fixes that a non-significant global result never terminates or
  # alters local discovery.
  alpha: 0.05
  global_test_statistic: max_abs_z    # FROZEN (II.1)
  compute_for_cohorts: [PLP, BLB]     # FROZEN (II.1)
  non_significant_terminates_discovery: false   # FROZEN (F5)

# --- II.2 — candidate r_hot search domain ------------------------------------
radius_domain:
  R_FLOOR: 5.0                        # FROZEN (II.2) — also the QC-H5 lower bound (alias R_MIN)
  R_CEIL: 25.0                        # FROZEN (II.2)
  r_cap_rule: "min(R_CEIL, 0.25 * D_max)"   # FROZEN (II.2)
  step_hot_A: 0.5                     # FROZEN (II.2)
  N_MIN_PCF: 10                       # FROZEN (II.2)
  pcf_elevation_percentile: 95.0      # FROZEN (II.2)
  margin_A: 1.0                       # FROZEN (II.2) — +/- 1 A around [a,b]
  fallback_envelope: "[5.0, min(25.0, 0.25 * D_max)]"   # FROZEN — fallback ONLY
  min_run_length_A: 2.0               # FT-2
  min_grid_points: 5                  # FT-3
  automatic_domain_expansion: false   # FROZEN (II.6) — prohibited

# --- II.3 / II.4 / F7 — permutation and multiple testing ---------------------
permutation:
  B_default: 100000                   # FROZEN (F7/F11) — DECISION-B-DEFAULT-0001 (was 10000)
  # --- [REVISED — Workflow v2 §5.2] PRIMARY vs SECONDARY null ----------------
  # v1 made the label-permutation null the PRIMARY per-center test. v2 §5.2
  # requires the primary test to use the SAME structure-aware positional null as
  # the global analysis (§3), so that a run cannot declare global clustering under
  # one null and fail to detect it under another — that is an inconsistency, not a
  # negative result. The KCNA2 run 20260817T155124Z is the worked example.
  #
  # The two nulls answer different questions and are never mixed:
  #   positional  — are P/LP residues placed more tightly than uniform placement
  #                 over U_struct, conditioned on N_P?
  #   label       — are P/LP residues more clustered than B/LB residues, GIVEN the
  #                 variant-bearing positions?
  primary_null: structure_aware_positional   # FROZEN (v2 §5.2) — the primary test
  local_null: label_permutation       # FROZEN (F4) — now the SECONDARY analysis only
  report_secondary_null: true         # v2 §5.2 — both reported side by side
  p_value_estimator: phipson_smyth_add_one   # FROZEN (II.3)
  exclude_uninformative_centers: true # n_L(c)=0 or sigma_c=0 leave the test family
fdr:
  method: BH                          # FROZEN (A10) — primary and only decision procedure
  q: 0.05                             # FROZEN (A10)
  secondary_report_method: BY         # comparison only, never a substitute
  boundary_ties_all_rejected: true    # FROZEN (II.4)
# --- [NEW — Workflow v2 §5.4] power certificate -------------------------------
# Mandatory precondition for ANY negative result. Computed before the per-center
# test and again after it; a failure at either instance is binding. No thresholds
# to declare here: the bar is c_1 = fdr.q / m, derived from the realized family.
power_certificate:
  enabled: true                       # FROZEN (v2 §5.4) — never optional
  preflight: true
  posthoc: true
  emit_artifact: true                 # v2 §11 — first-class output in every state

permutation_resolution_diagnostic:
  enabled: true
  preflight: true
  safety_factor_s: 10                 # FROZEN (II.4)
  # k_target in B_req = ceil(s*m/(k_target*q)) - 1. II.4 defines it as
  # max(n_floor, 1); fixing it at 1 is the most demanding choice and therefore the
  # safest recommendation. It affects only the RECOMMENDED B — never a p-value,
  # never a rejection, never the FDR method.
  k_target: 1
  b_ladder: [10000, 100000, 1000000, 10000000]   # FROZEN (II.4)
  max_recommendable_B: 10000000       # above this -> escalate, never recommend
  auto_change_B: false                # FROZEN — never automatic

# --- II.5A / F13 — LOO-MCC (radius-selection objective ONLY) -----------------
loo_mcc:
  role: radius_selection_only         # FROZEN (F13) — never hotspot validation
  kappa: 2.0                          # FROZEN (F13) — prevalence-anchored prior mass
  classification_threshold: null      # FROZEN (F13) — none exists, per radius or at all
  zero_neighbour_prediction: BLB      # FROZEN (F13)
  exact_tie_prediction: BLB           # FROZEN (F13)
  tie_tolerance: 1.0e-12              # FROZEN (F13)
  sparse_reporting_cutoff: 3          # n_L < 3 — REPORTING ONLY, never an exclusion
  drop_sparse_residues: false         # FROZEN (F13)
  undefined_mcc_value: 0.0            # recorded convention

# --- II.5E — radius QC / admissibility (constraints, not objectives) --------
radius_qc:
  QC_H2_max_coverage: 0.50            # FROZEN (II.5E)
  QC_H3_min_median_n_labeled: 2       # FROZEN (II.5E)
  QC_H4_max_isolated_center_fraction: 0.50   # FROZEN (II.5E)
  # --- [REVISED — Workflow v2 §4] admissibility is not significance -----------
  # v1 treated |S(r)| = 0 (QC-H1) as an admissibility failure, and QC-H2/QC-H4 are
  # likewise computed over S(r). A radius that found nothing was therefore struck
  # from the Pareto set, so significance chose the radius and the radius chose
  # significance. On KCNA2 that left 21 A as effectively the only survivor.
  #
  # v2: significance is an OBJECTIVE. A radius may be inadmissible only when a
  # declared quantity is genuinely undefined. The significance-conditioned rules
  # are retained as reported DIAGNOSTICS and never affect admissibility.
  significance_may_determine_admissibility: false   # FROZEN (v2 §4)
  admissibility_constraints: [FE_UNDEF, QC_H5_DOMAIN, QC_H3_UNDEFINED_MEDIAN]
  significance_conditioned_diagnostics: [QC_H1, QC_H2, QC_H4]
  admissibility_dominates_fraction: 0.50   # v2 §4 — ADVISORY above this

# --- II.6 / F15 — r_hot multi-objective selection ---------------------------
radius_selection:
  objectives:                         # FROZEN (II.6) — exactly four, all maximize
    - {name: loo_mcc,            direction: maximize}
    - {name: perm_evidence_zg,   direction: maximize}
    - {name: fold_enrichment,    direction: maximize}
    - {name: neighbor_stability, direction: maximize}
  weights_equal: true                 # FROZEN (F15)
  w_k: 1.0                            # FROZEN (F15) — auditable declaration
  normalization: min_max              # FROZEN (F15)
  normalization_domain: admissible_set # FROZEN (F15)
  degenerate_normalized_value: 1.0    # FROZEN (F15) — contributes 0 to every distance
  utopia_point: [1.0, 1.0, 1.0, 1.0]  # FROZEN (F15)
  distance_metric: L2                 # FROZEN (F15)
  tie_chain: [distance, neighbor_stability, perm_evidence_zg, smaller_radius]  # FROZEN (II.6)
  # [REVISED — DECISION-NEAR-TIE-0001] graded, and no longer gated on separation.
  near_tie_relative_threshold: 0.05   # ADVISORY boundary — non-blocking warning
  near_tie_major_threshold: 0.01      # below this the seed, not the data, decides
  # Retained for provenance only; it no longer gates the flag. It suppressed the
  # warning for ADJACENT radii, which is where ties are least visible (KCNA2:
  # 9.5 vs 10.0 A at 0.18% flips 1 region <-> 2 regions).
  near_tie_radius_separation_steps: 2 # INERT (was FROZEN II.6)
  objective_redundancy_abs_rho: 0.98  # escalation threshold
  # [NEW — Workflow v2 §4] An objective with an identical value at every admissible
  # radius discriminates nothing; including it adds a constant to every candidate's
  # distance-to-utopia and hides how few objectives are actually deciding.
  exclude_degenerate_objectives: true      # FROZEN (v2 §4)

# --- [NEW — Workflow v2 §4] biological plausibility, computed and reported ---
# v2 requires structural_coverage / cohort_absorption / r_to_domain_ratio
# "computed at every candidate radius" and states they "enter selection", but
# does not revise F15's separately FROZEN "exactly four objectives" (asserted
# above and in hotspot/selection.py). Folding three more axes into the Pareto
# vector would be a methodological amendment to F15 that v2's text never states
# explicitly, and a silent one at that — exactly what the Lead was told to halt
# on rather than introduce quietly.
#
# RULING (documented, not silent): these three quantities are computed at every
# candidate radius, reported in the radius scan and decision trace, and enforced
# as WARNING THRESHOLDS on the SELECTED radius — never as Pareto objectives and
# never as admissibility constraints (a radius is not struck for a high value,
# only flagged). This satisfies every checkable requirement in the v2 table
# (computed, reported, a MAJOR warning above the stated bound) while leaving the
# frozen four-objective Pareto machinery, and therefore every existing selection
# result, untouched. F15's "exactly four" holds exactly as before.
biological_plausibility:
  enabled: true
  structural_coverage_penalty_threshold: 0.25    # v2 §4 — soft penalty (reported)
  structural_coverage_major_threshold: 0.50      # v2 §4 — MAJOR warning
  cohort_absorption_penalty_threshold: 0.33      # v2 §4 — soft penalty (reported)
  r_to_domain_ratio_penalty_threshold: 0.5       # v2 §4 — soft penalty (reported)
  enters_pareto_objectives: false   # see ruling above — F15 stays at exactly four
  radius_of_gyration_source: modelled_structure_ca_coordinates

# --- II.6 / II.10 — domain boundary diagnostic (both grids) -----------------
boundary_diagnostic:
  enabled: true
  band_fraction: 0.10                 # b = max(1, ceil(0.10 * G))   FROZEN
  bw2_pareto_fraction: 0.50           # FROZEN
  bw3_top_n: 3                        # FROZEN
  auto_widen_domain: false            # FROZEN — prohibited

# --- II.7 — final detection and region definition ---------------------------
final_detection:
  # F9's original framing predates the v2 §2 U_center/U_struct split (see
  # plddt.center_universe_* above). The VALUE is unchanged — U_struct remains the
  # positional reference every candidate center is anchored to and the population
  # the positional null places over — but "every residue with a usable Ca" is no
  # longer literally the candidate-CENTER set: a residue with pLDDT below
  # plddt.center_universe_min_plddt is excluded from U_center (retained in
  # U_struct and in the cohort L). This key still correctly names U_struct as the
  # reference universe; it does not by itself claim every U_struct residue is a
  # tested center.
  center_universe: U_struct           # FROZEN (F9) — the positional reference universe
  region_edge_rule: "d(c,c') <= 2 * r_hot"   # FROZEN (A13)
  emit_three_residue_objects: true    # FROZEN (F9) — never collapsed
sensitivity_analyses:                 # FROZEN (II.7) — post-primary, NEVER redefining
  run_at_frozen_r_hot: true
  may_redefine_primary: false
  plddt70: true
  review_status_strata: [1, 2]
  global_clustering_caveat: true

# --- II.8 — footprint geometry ----------------------------------------------
footprint_geometry:
  voxel_h_A: 0.5                      # FROZEN (A18)
  voxel_h_fallback_A: 1.0             # FROZEN (A18)
  voxel_count_fallback_threshold: 100000000   # 1e8   FROZEN (A18)
  bbox_padding_A: 2.0                 # FROZEN (II.8)
  connectivity: 6                     # FROZEN (A18) — face adjacency
  surface_method: marching_cubes      # FROZEN (A18)
  erosion_fraction: 0.15              # FROZEN (A16) — relative erosion depth
  abrupt_dncomp_threshold: 2          # FROZEN (II.8)
  abrupt_er_median_multiple: 2.0      # FROZEN (II.8)

# --- II.9 — candidate r_fp search domain ------------------------------------
footprint_domain:
  # [REVISED — DECISION-FOOTPRINT-DOMAIN-0001] The domain is now [5.0,
  # min(0.25*D_max, 25.0)], structurally identical in FORM to radius_domain (II.2).
  # The MST-derived 1.25*rho_all term no longer caps rho_max: rho_all measures how
  # tightly the CENTERS are packed, which is not what the footprint radius is for.
  # With sequence-adjacent centers the longest MST edge is one Ca-Ca step (~3.8 A),
  # so 1.25*rho_all ~ 2.4 A < the old 3.0 A floor and the domain came out EMPTY —
  # 6 of 8 BLOCKED genes in the ACMG SF v3.2 batch, plus 18 genes pinned to the floor.
  # Merge scales are still computed and still reported as merge events.
  rho_min_A: 5.0                      # REVISED (was 3.0) — mirrors radius_domain.R_FLOOR
  rho_max_rule: "min(0.25 * D_max, 25.0)"   # REVISED — MST term removed from the bound
  rho_all_source: mst_merge_scales    # FROZEN (II.9) — single-linkage heights halved
  post_merge_factor_caps_rho_max: false   # REVISED — the substantive half of this change
  post_merge_factor: 1.25             # retained: merge-event reporting and provenance
  dmax_fraction_cap: 0.25             # FROZEN (II.9) — unchanged, never was the defect
  hard_ceiling_A: 25.0                # REVISED (was 20.0) — mirrors radius_domain.R_CEIL
  step_fp_A: 0.5                      # FROZEN (II.9) — uniform, never adaptive
  # F10 intact: the 5.0 floor is a fixed constant that happens to equal the II.2
  # constant. It is NOT derived from any run's selected r_hot.
  bound_below_by_r_hot: false         # FROZEN (F10) — r_fp is independent of r_hot

# --- II.10 — footprint QC and selection -------------------------------------
footprint_qc:
  QC_F1_max_coverage: 0.50            # FROZEN (II.10) — hard gate, never relaxed
  coverage_denominator: U_struct      # FROZEN (II.10)
  QC_F2_max_bridging_index: 0.50      # FROZEN (II.10)
  all_inadmissible_escalation_fraction: 0.95   # FROZEN (II.10)
  relax_on_failure: false             # FROZEN (II.10)
  # --- [NEW — Workflow v2 §7] the §4 objective/constraint split, verbatim -----
  # Footprint admissibility (QC_F1/F2/F3 above) is already purely geometric —
  # coverage, bridging, undefined geometry — never conditioned on how many
  # significant centers a radius produced, since r_fp does not re-test
  # significance at all (it operates on the already-frozen
  # SIGNIFICANT_HOTSPOT_CENTERS set). Nothing here changes; this key is the
  # parity threshold for the same ADVISORY diagnostic Stage B carries
  # (radius_qc.admissibility_dominates_fraction), distinct from the pre-existing
  # FROZEN (II.10) 0.95 escalation above, which is a separate, more severe rule.
  admissibility_dominates_fraction: 0.50   # v2 §4/§7 — ADVISORY above this
footprint_selection:
  objectives:                         # FROZEN (II.10) — geometry-specific, four
    - {name: compactness,  direction: maximize}
    - {name: connectivity, direction: maximize}
    - {name: stability,    direction: maximize}
    - {name: parsimony,    direction: maximize}   # 1 - coverage, anti-inflation
  descriptive_only: [convexity, expansion_rate, n_components, n_bridges, merge_events]
  weights_equal: true                 # FROZEN (F15)
  w_k: 1.0
  normalization: min_max
  normalization_domain: admissible_set
  utopia_point: [1.0, 1.0, 1.0, 1.0]
  distance_metric: L2
  tie_chain: [distance, stability, compactness, smaller_radius]   # FROZEN (II.10)
  near_tie_relative_threshold: 0.05   # ADVISORY boundary
  near_tie_major_threshold: 0.01      # DECISION-NEAR-TIE-0001 — MAJOR below this
  objective_redundancy_abs_rho: 0.98
  # [NEW — Workflow v2 §4/§7] Same degenerate-objective neutrality Stage B
  # carries; the shared utils.multiobjective machinery already implements the
  # exclusion identically for both callers (F15), this key only mirrors Stage
  # B's config declaration so the behaviour is equally auditable here.
  exclude_degenerate_objectives: true      # FROZEN (v2 §4/§7)

# --- II.11 / F11 — robustness (geometric footprint robustness ONLY) ---------
robustness:
  target: final_footprint             # FROZEN (F11)
  perturbation_universe: SIGNIFICANT_HOTSPOT_CENTERS   # FROZEN (A21) — never ClinVar records
  rerun_hotspot_pipeline: false       # FROZEN (F11/A7) — deprecated design, prohibited
  modify_clinvar_records: false       # FROZEN (A21)
  K_MAX_rule: "min(n_S - 1, floor(n_S / 2))"   # FROZEN (A19)
  N_CAP: 10000                        # config knob with a stated cost model
  sampling: seeded_combinatorial_unranking     # FROZEN (A19) — without replacement
  budget_allocation: equal_across_remaining_levels   # FROZEN (A19)
  # VESTIGIAL (DECISION-STAGE-D-FIXED-RFP-0001, 2026-08-18). That decision made
  # fixed-radius reconstruction the SOLE per-iteration path and deleted the
  # re-deriving 'primary' one, but deliberately left this file byte-unchanged, so the
  # key survived its own meaning. It can only be true; robustness/params.py now
  # refuses false rather than accepting it and silently doing nothing.
  secondary_fixed_radius_reconstruction: true  # was FROZEN (II.11)
  preservation_threshold_primary: 0.50   # FROZEN (A20)
  preservation_threshold_secondary: 0.70 # FROZEN (A20)
  bootstrap:
    method: BCa                       # FROZEN (A20)
    resamples: 10000                  # FROZEN (A20)
    confidence: 0.95
  emit_categorical_verdict: false     # FROZEN (II.11) — no ROBUST/NOT_ROBUST primary output
  # Operational budget guard, not a scientific constant. N_CAP iterations at
  # ~1.5-15 s each is 4-40 h for a real protein with n_S ~ 25, so the stage must be
  # able to escalate BEFORE spending it rather than discovering the cost mid-run.
  # null = no wall-time ceiling; the escalation path stays dormant.
  #
  # ACTIVATED before the first real gene. 144000 s = 40 h is the upper bound of the
  # cost envelope stated one line above, so the guard fires only on a run that is
  # unusually expensive BY THIS STAGE'S OWN COST MODEL — it is read off that model,
  # not invented as a new threshold, and a normal production run never trips it.
  #
  # Strictly advisory and strictly preflight. The check runs after the subset design
  # is recorded and before iteration 1, against the design's own measured
  # seconds-per-iteration estimate. It raises EscalationRequired, which HALTS and
  # hands the Lead the decision. It never reduces N_CAP, never truncates the design,
  # never samples differently and never touches a p-value, a radius or an inference.
  max_wall_seconds: 144000
  failed_iterations_jaccard: 0.0      # FROZEN (II.11) — stay in every denominator
  min_n_S_for_evaluation: 2           # below -> ROBUSTNESS_NOT_EVALUABLE

# --- II.13 — annotation (Stage E, strictly downstream) ----------------------
annotation:
  mechanism_categories: [GOF, LOF, DN, Mixed, Unclear, Not_Experimentally_Characterized]
  evidence_levels: [STRONG, MODERATE, WEAK, NONE]   # FROZEN (A23)
  min_evidence_for_label: MODERATE    # FROZEN (A23)
  conflicting_strong_resolution: Mixed        # FROZEN (A23)
  weak_only_resolution: Unclear               # FROZEN (A23)
  conservation_source: dbNSFP                 # FROZEN (A22) — version-pinned at run time
  conservation_metrics: [GERP++_RS, phyloP100way]   # FROZEN (A22)
  secondary_structure_tool: DSSP
  require_versioned_sources: true             # FROZEN — unversioned source may not be used
  posthoc_gate:                               # FROZEN (A24)
    min_variants_per_category: 10
    min_evidence: MODERATE
    min_categories: 2
    separate_correction: true
    feeds_upstream: false
  may_influence_discovery: false              # FROZEN — structural assertion

# --- II.12 — deterministic seeding ------------------------------------------
seeding:
  MASTER_SEED: 20250101               # FROZEN (II.12)
  derivation: "sha256(MASTER_SEED|run_id|context)[:16] mod 2^32"   # FROZEN (II.12)
  generator: PCG64                    # FROZEN (II.12)
  order_independent: true             # FROZEN (II.12) — parallel execution is bit-reproducible

# --- Part IX — Output Contract ----------------------------------------------
output:
  run_id_format: "<YYYYMMDDTHHMMSSZ>_<config_sha256[0:8]>_<code_version[0:8]>"
  atomic_partial_suffix: ".partial"
  failed_suffix: ".failed"
  encoding: utf-8
  line_ending: LF
  crlf_files: [README.txt, transfer_info.txt]
  tsv:
    missing_value: "NA"
    boolean_true: "TRUE"
    boolean_false: "FALSE"
    float_significant_digits: 6
  filename_regex: "^[A-Za-z0-9._-]+$"
  max_relative_path_length: 150
  review_pack:
    size_budget_bytes: 26214400       # 25 MB
    figure_dpi: 150
    hardlink_when_possible: true
    self_contained_html: true         # no CDN, no fetch/XHR — must open from file://
  full_results:
    figure_dpi: 300
  archives:
    review_pack_format: zip
    full_results_format: tar.gz
    checksum_file: checksums.sha256
    exclude_archives_dir: true
  transfer:
    emit_transfer_info: true
    perform_transfer: false           # FROZEN (P10) — pipeline never copies off-machine
  warning_severities: [INFO, ADVISORY, MAJOR, BLOCKING]
  run_status_exit_codes:
    COMPLETED: 0
    COMPLETED_WITH_WARNINGS: 0
    COMPLETED_NEGATIVE: 0
    UNDERPOWERED: 3            # Workflow v2 §0 — uninformative, not a result
    PARTIAL: 0
    FAILED: 1
    BLOCKED: 2
  retain:
    per_radius_center_sets: true
    per_radius_footprint_components: true
    per_radius_voxel_grids: false     # P5 — regenerable, recipe recorded
    per_iteration_directories: false  # IX.3 — inode control, bundled tar.gz instead

# --- execution --------------------------------------------------------------
execution:
  offline_mode: false                 # set TRUE for synthetic/mock runs
  allow_network: true                 # Stage A and Stage E only; B/C/D hold no network tools
  # Stage D robustness iteration parallelism (process pool). Permanent machine
  # policy, not a per-run scientific decision: this node is shared with other
  # users and jobs and has no scheduler, so this NEVER auto-scales to the
  # node's CPU count -- it is exactly this number, always, capped only DOWN
  # to the number of iterations actually planned for a small run. Iterations
  # are pure functions of (index, removed-subset, seed_context); worker count
  # and execution order never affect any iteration's own result (II.12).
  n_jobs: 16
  # Positive nice value applied inside each worker process so it yields CPU
  # to other users' and other jobs' work automatically -- the default is safe
  # to run at any time without checking node load first.
  worker_nice: 10
