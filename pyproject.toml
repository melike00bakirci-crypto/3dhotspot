[project]
name = "hotspot3d"
version = "0.1.0"
description = "Gene-independent 3D spatial hotspot and footprint pipeline for pathogenic missense variants"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "networkx>=3.1",
    "requests>=2.31",
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
hotspot3d = "hotspot3d.orchestration.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotspot3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: scientific-core unit test",
    "integration: end-to-end synthetic test",
    "slow: long-running test",
]
filterwarnings = ["error::RuntimeWarning"]
